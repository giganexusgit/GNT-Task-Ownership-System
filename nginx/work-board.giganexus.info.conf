# Nginx Configuration for work-board.giganexus.info
# Placed on VPS at: /etc/nginx/sites-available/work-board.giganexus.info

# HTTP - Redirect all traffic to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name work-board.giganexus.info;

    return 301 https://$host$request_uri;
}

# HTTPS - Primary application server block
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name work-board.giganexus.info;

    root /var/www/work-board;
    index index.html;

    # SSL Certificates (managed automatically by Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/work-board.giganexus.info/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/work-board.giganexus.info/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # React Single Page Application (SPA) Routing Fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static Asset Caching (Vite hashed bundles & images)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Disable logging for favicon and robots.txt
    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    # Prevent access to hidden files (e.g. .env, .git)
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
