name: Deploy Workboard to VPS

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          passphrase: ${{ secrets.VPS_SSH_PASSPHRASE }}
          password: ${{ secrets.VPS_PASSWORD }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "🚀 Starting deployment on VPS..."
            cd ~/work-board-frontend
            
            echo "📥 Pulling latest changes from git..."
            git pull origin main
            
            echo "📦 Installing dependencies..."
            npm install
            
            echo "🔨 Building production bundle..."
            npm run build
            
            echo "📁 Copying build files to /var/www/work-board..."
            mkdir -p /var/www/work-board
            cp -r dist/* /var/www/work-board/
            chown -R www-data:www-data /var/www/work-board
            
            echo "⚙️ Syncing Nginx configuration..."
            if [ -f nginx/work-board.giganexus.info.conf ]; then
              cp nginx/work-board.giganexus.info.conf /etc/nginx/sites-available/work-board.giganexus.info
              ln -sf /etc/nginx/sites-available/work-board.giganexus.info /etc/nginx/sites-enabled/
              nginx -t && systemctl reload nginx
              echo "🔄 Nginx reloaded successfully!"
            fi
            
            echo "✅ Deployment completed successfully!"
